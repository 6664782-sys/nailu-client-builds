name: NaiLu client builds
run-name: NaiLu TG ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Unique Telegram build ID
        required: true
      settings:
        description: Validated non-secret build settings JSON
        required: true
permissions:
  contents: read
concurrency:
  group: nailu-telegram-${{ inputs.job_id }}
  cancel-in-progress: false
env:
  GOFLAGS: '-buildvcs=false'
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 6664782-sys/nailu-private-builds
          token: ${{ secrets.NAILU_PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Select requested platforms
        id: matrix
        env:
          NAILU_BUILD_SETTINGS: ${{ inputs.settings }}
          NAILU_PREPARE_MATRIX: '1'
        run: python prepare_client.py
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 6664782-sys/nailu-private-builds
          token: ${{ secrets.NAILU_PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Android runner disk budget
        if: matrix.platform == 'android'
        shell: bash
        working-directory: .
        run: |
          # These are disposable hosted-runner tools unused by this APK build.
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/ndk
          df -h /
          available_kb=$(df --output=avail -k / | tail -1)
          test "$available_kb" -ge 25000000 || { echo 'At least 25 GB free space is required for the native Android build'; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and unpack private source
        shell: python
        working-directory: .
        run: |
          import hashlib, pathlib, stat, zipfile
          source = pathlib.Path('nailu-source.zip')
          expected = pathlib.Path('nailu-source.sha256').read_text().split()[0]
          assert hashlib.sha256(source.read_bytes()).hexdigest() == expected
          with zipfile.ZipFile(source) as archive:
              assert sum(i.file_size for i in archive.infolist()) < 1024 * 1024 * 1024
              for name in archive.namelist():
                  path = pathlib.PurePosixPath(name)
                  assert path.parts[0] == 'client' and '..' not in path.parts and not path.is_absolute() and '\\' not in name
              archive.extractall()
          for path in pathlib.Path('client').rglob('*.sh'):
              path.chmod(path.stat().st_mode | stat.S_IXUSR)
      - name: Apply verified NaiLu client fixes
        shell: python
        working-directory: .
        run: |
          import hashlib, pathlib, zipfile
          patch = pathlib.Path('nailu-update.zip')
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == '77ed8ab94f6e25a5c7bb7aae276e15379e52893aefc622ce4e0c3d3b4011621b'
          with zipfile.ZipFile(patch) as archive:
              assert sum(i.file_size for i in archive.infolist()) < 32 * 1024 * 1024
              for name in archive.namelist():
                  path = pathlib.PurePosixPath(name)
                  assert path.parts[0] == 'client' and '..' not in path.parts and not path.is_absolute() and '\\' not in name
              archive.extractall()
      - name: Apply requested configuration
        shell: bash
        working-directory: .
        env:
          NAILU_BUILD_SETTINGS: ${{ inputs.settings }}
        run: python prepare_client.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: client/core/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: 'platform-tools'
      - name: Android native tools
        if: matrix.platform == 'android'
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
      - name: Android host libclang for Rust bindgen
        if: matrix.platform == 'android'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/nailu-libclang" libclang==18.1.1
          python - <<'PY'
          import os, pathlib
          library = next((pathlib.Path(os.environ['RUNNER_TEMP']) / 'nailu-libclang').rglob('libclang.so'))
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('LIBCLANG_PATH=' + str(library.parent) + '\n')
          PY
      - uses: NuGet/setup-nuget@v2
        if: matrix.platform == 'windows'
      - name: macOS toolchain
        if: matrix.platform == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
      - name: Intel renderer
        if: matrix.platform == 'macos' && matrix.arch == 'x64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist
      - run: flutter pub get
      - name: Test client
        shell: bash
        run: |
          cp pubspec.yaml "$RUNNER_TEMP/nailu-pubspec.yaml"
          trap 'cp "$RUNNER_TEMP/nailu-pubspec.yaml" pubspec.yaml' EXIT
          python -c "from pathlib import Path; p=Path('pubspec.yaml'); p.write_text(p.read_text().replace('build_assets: true','build_assets: false'))"
          flutter test test/nailu
          node test/nailu/portal_script_test.cjs
      - run: flutter analyze --no-fatal-infos
      - name: Private encryption and Android signing inputs
        shell: python
        env:
          NAILU_CONFIG_KEY: ${{ secrets.NAILU_CONFIG_KEY }}
          NAILU_SUBSCRIPTION_KEY: ${{ secrets.NAILU_SUBSCRIPTION_KEY }}
          KEYSTORE_BASE64: ${{ secrets.NAILU_ANDROID_KEYSTORE_BASE64 }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          import base64, json, os, pathlib
          values = {n: os.environ.get(n, '') for n in ('NAILU_CONFIG_KEY', 'NAILU_SUBSCRIPTION_KEY')}
          assert all(len(base64.b64decode(v, validate=True)) == 32 for v in values.values())
          pathlib.Path('.nailu-build-defines.json').write_text(json.dumps(values))
          if os.environ['PLATFORM'] == 'android':
              raw = base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True)
              assert len(raw) > 1000, 'Original Android keystore secret required'
              path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nailu-release.jks'
              path.write_bytes(raw)
              with open(os.environ['GITHUB_ENV'], 'a') as stream:
                  stream.write('NAILU_ANDROID_KEYSTORE=' + path.as_posix() + '\n')
      - name: Build Windows
        if: matrix.platform == 'windows'
        run: flutter build windows --release --dart-define=APP_ENV=stable --dart-define-from-file=.nailu-build-defines.json
      - name: Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'nailu-inno'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.4.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys') { throw 'Compiler signature verification failed' }
          $p = Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',"/DIR=$compilerRoot") -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Compiler installation failed' }
          & tool/build-nailu-installer.ps1 -Iscc (Join-Path $compilerRoot 'ISCC.exe')
          Compress-Archive -LiteralPath (Get-ChildItem dist/*.exe).FullName -DestinationPath "dist/NaiLu-${env:NAILU_VERSION}-windows-x64.zip"
      - name: Build Android
        if: matrix.platform == 'android'
        shell: bash
        env:
          NAILU_ANDROID_STORE_PASSWORD: ${{ secrets.NAILU_ANDROID_STORE_PASSWORD }}
          NAILU_ANDROID_KEY_PASSWORD: ${{ secrets.NAILU_ANDROID_KEY_PASSWORD }}
          NAILU_ANDROID_KEY_ALIAS: ${{ secrets.NAILU_ANDROID_KEY_ALIAS }}
        run: |
          test -n "$NAILU_ANDROID_STORE_PASSWORD" && test -n "$NAILU_ANDROID_KEY_PASSWORD" && test -n "$NAILU_ANDROID_KEY_ALIAS"
          flutter build apk --release --target-platform android-arm64 --dart-define=APP_ENV=stable --dart-define-from-file=.nailu-build-defines.json
          python tool/verify-android-package.py build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/NaiLu-${NAILU_VERSION}-android-arm64.apk"
          python -c 'import pathlib,zipfile; p=next(pathlib.Path("dist").glob("*.apk")); z=zipfile.ZipFile(p.with_suffix(".zip"),"w"); z.write(p,p.name); z.close()'

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: flutter build macos --release --dart-define=APP_ENV=stable --dart-define-from-file=.nailu-build-defines.json
      - name: macOS installer
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/NaiLu.app "dist/NaiLu-${NAILU_VERSION}-macOS-${{ matrix.arch }}-unsigned.zip"
          hdiutil create -volname 'NaiLu' -srcfolder build/macos/Build/Products/Release/NaiLu.app -ov -format UDZO "dist/NaiLu-${NAILU_VERSION}-macOS-${{ matrix.arch }}-unsigned.dmg"
      - name: Checksums
        shell: python
        run: |
          import hashlib, pathlib
          root = pathlib.Path('dist')
          files = sorted(p for p in root.iterdir() if p.is_file())
          assert files
          (root / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files))
      - uses: actions/upload-artifact@v4
        with:
          name: NaiLu-${{ matrix.platform }}-${{ matrix.arch }}
          path: client/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Remove private build settings
        if: always()
        shell: python
        run: |
          import os, pathlib
          pathlib.Path('.nailu-build-defines.json').unlink(missing_ok=True)
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'nailu-release.jks').unlink(missing_ok=True)
